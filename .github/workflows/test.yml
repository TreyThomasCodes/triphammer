name: test

# The node tests run in three shards side by side (node deals the sorted test files out in turn), and the pull request
# contract tests and shellcheck in a job of their own. The branch rules require a check named `test`, so the last job,
# which passes only when every other one passed, carries that name. Each job has a time limit, so a hung test fails
# its job instead of running for GitHub's six hours; a shard takes two to three minutes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Tooling tests
        run: npm run -s test:node
        env:
          TEST_SHARD: ${{ matrix.shard }}/3

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pull request contract tests
        run: bash scripts/test-pr-contract.sh
      - name: shellcheck
        run: |
          mapfile -t scripts < <(grep -lE '^#!.*\b(bash|sh)\b' install.sh bin/* scripts/* scripts/git-hooks/* .github/scripts/* 2>/dev/null)
          shellcheck -x -S warning "${scripts[@]}"

  test:
    name: test
    needs: [node, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
